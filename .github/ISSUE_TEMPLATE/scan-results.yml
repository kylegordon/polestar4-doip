name: Scan results from my car
description: Which modules and data identifiers answered on your Polestar 4 (no values).
labels: [scan-results]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for scanning. Follow the steps on the site's Contribute page first.
        Share which identifiers answered and their lengths only, never their values.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I have read the Hazards page and no warning lamps or lost modules happened (or I describe them below).
          required: true
        - label: My attachments hold no VIN, serial numbers, SIM or modem numbers, GPS position, number plate or names.
          required: true
        - label: I am not attaching anything from runs/, packet captures, or identify, whois or strings output.
          required: true
  - type: input
    id: market
    attributes:
      label: Market and model year
      placeholder: e.g. UK, 2026
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: Car software version
      placeholder: e.g. 4.2.11
    validations:
      required: true
  - type: textarea
    id: discover
    attributes:
      label: Output of ./p4 discover
      render: text
    validations:
      required: true
  - type: textarea
    id: scan
    attributes:
      label: Scan results
      description: Attach my-scan.csv (module, DID, status, length) made with `./p4 export --format csv | cut -d, -f1-4 > my-scan.csv`.
  - type: textarea
    id: notes
    attributes:
      label: Anything unusual
      description: Modules that stopped answering, refusals, differences from the published findings.
