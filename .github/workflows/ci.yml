name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tool
      P4_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Nothing identifying is tracked
        run: scripts/prepublish-check.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/requirements-dev.txt
      - name: Install
        run: pip install -r tool/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check tool/p4doip web scripts
      - name: Types (mypy)
        run: mypy tool/p4doip
      - name: Shell scripts (shellcheck)
        run: shellcheck p4 scripts/*.sh web/start.sh
      - name: Container image builds
        run: docker build -t p4doip:ci tool
      - name: Offline tests (simulated gateway)
        run: pytest -p no:cacheprovider --cov=tool/p4doip --cov-report=term-missing --cov-fail-under=87 tool/tests
      - name: Public site builds and passes its output scan
        run: python -m p4doip.site build --out "$RUNNER_TEMP/_site"
