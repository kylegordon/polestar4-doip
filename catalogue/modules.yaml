# Modules that answer on the Polestar 4. addr is quoted hex.
# label: the usual Volvo/Geely short name for a module at that address on related cars (a guess, not read from this car).
# role: usual meaning of that label.
# status: confirmed = behaviour checked on this car; unverified = label only; unknown = no label anywhere.
- {addr: "1001", label: VCM, role: "gateway address (Polestar bulletins call the P4 gateway VGM, Vehicle Gateway Module, TJ 37280, and on the Polestar 2/3 use VCM for the Vehicle Connectivity Module, TJ 36628: the VCM label may be wrong here; no bulletin gives the VGM's address; this address's own FD03 build string contains VGM)", status: unverified}
- {addr: "1011", label: TEM, role: telematics, status: unverified}
- {addr: "1012", label: DMM, role: driver monitoring, status: unverified}
- {addr: "1015", label: WAM, role: "360 camera / park assist, most likely (label WAM = Wide Angle vision Module per a Volvo technical bulletin; four surround-view camera entries, parking sensor distances, PAS software)", status: confirmed}
- {addr: "1023", label: BNCM, role: "key system control module by Marquardt (model GE1, FCC ID IYZGE1); reports F197 BNCM and F18A MARQUARDT, which match the manual's key system certification", status: unverified}
- {addr: "1201", label: IHU, role: infotainment (park D938), status: confirmed}
- {addr: "1202", label: TVM, role: camera/vision, status: unverified, note: "same physical unit as 1201 (same core part and serial)"}
- {addr: "1212", label: AUD, role: audio amplifier, status: unverified}
- {addr: "1213", label: RSEM, role: rear seat entertainment, status: unverified}
- {addr: "1251", label: HUD, role: head-up display, status: unverified, note: answers a physical address scan but not the 1FFF broadcast}
- {addr: "1301", label: ADCU3, role: Mobileye SuperVision driver assistance (never read EE13 or EE14), status: unverified}
- {addr: "1314", label: DVR 12V, role: dash camera recorder, status: unverified}
- {addr: "1316", label: "?", role: "?", status: unknown, note: "pair with 1317 (same HW 6608445312 and delivery part, different software parts, serials 7 apart); radar guess weakened: the manual certifies only one radar; D237 is a heartbeat log"}
- {addr: "1317", label: "?", role: "?", status: unknown, note: "pair with 1316; the part is a Polestar-branded unit with a wire antenna (docs/siblings.md)"}
- {addr: "1344", label: FLR4, role: "front radar; the manual certifies one radar, the F5CP12 front-centre unit (FCC grantee NF3 = Bosch)", status: unverified}
- {addr: "1601", label: VDDM, role: vehicle dynamics / parking brake, status: confirmed}
- {addr: "1614", label: SUM, role: suspension (chassis mode D90F), status: confirmed}
- {addr: "1615", label: SCL, role: steering column lock, status: unverified}
- {addr: "1631", label: BCM, role: "probably the front drive motor controller (vehicle speed D003; E307/E303 active only when the front motor drives; a US owner reads F80A DMC2)", status: confirmed}
- {addr: "1633", label: EGSM, role: gear selector, status: unverified}
- {addr: "1635", label: BECM, role: HV battery, status: confirmed}
- {addr: "1637", label: IEM, role: rear inverter / e-machine (drive engaged E307, torque direction E319), status: confirmed}
- {addr: "1650", label: CDD, role: "charger and charge inlet; per Polestar TJ 37772 the CDD (Charger and DCDC Module) also holds the DC-DC converter", status: confirmed}
- {addr: "1656", label: "?", role: "charging-related, from its own name string: since 4.3.0 F80A reads BCC1-B+ChargerCtrl1 (4947 reads the 12 V rail in mV; D110 follows HV pack current; HX1100 hardware string)", status: unknown, note: "answers 52 DIDs on 4.3.0, 37 on 4.2.11 (the F4xx and F8xx DIDs refused before the update)"}
- {addr: "1670", label: PSCM, role: "power steering, first channel (3019 = 0x3853 - 0.5614 x 1672:3019, opposite sign; D901 assist load peaks at full lock)", status: confirmed}
- {addr: "1672", label: SAS, role: "steering angle (3019 also on 1670/1676; a US owner reads F80A CHCM, chassis controller)", status: confirmed, note: "same physical unit as 1633 (same core part and serial)"}
- {addr: "1675", label: "?", role: "Bosch chassis sensor? (its D901 part is sold used as a Bosch sensor, see docs/siblings.md; FE08 and D941 look like received brake pressure and speed)", status: confirmed}
- {addr: "1676", label: "?", role: "power steering, second channel (same DID set as 1670; 3019/D900 read the same angle within 0-2 counts, up to 4 while turning; D901 assist load peaks at full lock on both)", status: confirmed, note: "sibling part numbers to 1670 (F1AE 6608507905-07 vs 6608507908-10), same F1AB delivery part"}
- {addr: "1691", label: "?", role: "a second address for 1601: answers the same DIDs (701 of its 702; F13F refuses here, response too long) with the same parts and software", status: unknown, note: "first seen 2026-11-22 after the 4.3.0 install; does not answer the 1FFF broadcast, so it may have been there before"}
- {addr: "1701", label: BSCM, role: "brake system (F80A reads BSCM-BrakeSystem, 2026-11-12)", status: confirmed}
