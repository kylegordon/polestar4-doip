- {addr: "1A13", label: PDM, role: passenger door (left front), status: confirmed}
- {addr: "1A15", label: POT, role: tailgate, status: confirmed}
- {addr: "1A21", label: RLDM, role: left rear door, status: confirmed}
- {addr: "1A22", label: RRDM, role: right rear door, status: confirmed}
- {addr: "1A27", label: SMD, role: driver seat, status: confirmed}
- {addr: "1A28", label: SMP, role: passenger seat, status: confirmed}
- {addr: "1A29", label: SMB, role: rear seats (heating, recline), status: confirmed}
