# 1251 (head-up display): continuous polling while driving makes the car report Pilot Assist unavailable (2026-11-15, owner watching
# the display, not unsafe; clears when the reads stop). Pass 1 17:48:12-17:48:51 (these nine + 1601:EE27), errors; all traffic stopped,
# errors stopped; pass 2 17:50:11 same watch, errors; pass 3 17:52:11 these nine only, errors. Two single reads, five quick reads of D110
# and one pass of all nine: no errors; a 10 s continuous loop: errors. Not yet tried parked. Caution, so ordinary scans and watches skip
# them; --allow-caution for a deliberate test.
