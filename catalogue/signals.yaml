- {id: wheel_speed_1, module: "1601", did: "E3E4", name: "Wheel speed 1 (corner unknown)", type: u, scale: 0.0140625, unit: " km/h", confidence: P,
   examples: [{raw: "0ddc", value: 49.89375}, {raw: "0000", value: 0}]}
- {id: wheel_speed_2, module: "1601", did: "E3E5", name: "Wheel speed 2 (corner unknown)", type: u, scale: 0.0140625, unit: " km/h", confidence: P,
