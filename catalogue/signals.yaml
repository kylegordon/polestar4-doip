# Motor speeds: 0x4E20 (20000) at rest, about 83 counts per km/h. E3E8 sits at 4e20 while cruising and matches E3E9 when pulling away:
# fits the front motor disconnect in Range power delivery. Decoded with the 20000 offset removed (0 = stopped).
- {id: motor_speed_front, module: "1601", did: "E3E8", name: "Front motor speed? (counts, 0 = stopped or disconnected)", type: u, add: -20000, confidence: P,
   examples: [{raw: "4e20", value: 0}, {raw: "5dd6", value: 4022}]}
- {id: motor_speed_rear, module: "1601", did: "E3E9", name: "Rear motor speed? (counts, 0 = stopped)", type: u, add: -20000, confidence: P,
   examples: [{raw: "4e20", value: 0}, {raw: "5e56", value: 4150}]}
# Longitudinal acceleration: about 128 counts per m/s2 against the derivative of D003 (r 0.75-0.84); + = slowing. Parked it reads a fixed
# offset that depends on the slope where the car stands (gravity), so it is an inertial sensor.
- {id: long_accel_vddm, module: "1601", did: "2B11", name: "Longitudinal deceleration (+ = slowing; includes slope)", type: s, scale: 0.0078125, unit: " m/s2", confidence: P,
   examples: [{raw: "00000012", value: 0.140625}, {raw: "fffffff4", value: -0.09375}]}
- {id: long_accel_bscm, module: "1701", did: "2B11", name: "Longitudinal deceleration (+ = slowing; includes slope and an offset)", type: s, scale: 0.0078125, unit: " m/s2", confidence: P,
   examples: [{raw: "ffe0", value: -0.25}]}
# Brake: E3C7 - 0x4000 = 7.2 x 1701 FE08 ch1 + 40 (r 0.998, 2026-11-13 morning drive); raw 0x4000 with the brake released, higher when held at a stop.
- {id: brake_pressure_vddm, module: "1601", did: "E3C7", name: "Brake pressure? (counts, 0 = none)", type: u, add: -16384, confidence: P,
