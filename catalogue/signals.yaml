# Signals confirmed on the Polestar 4 by behaviour (not by catalogue names).
# Required keys: id, module, did, name, confidence, examples. module and did are quoted hex; module may be "1BB3,1BB4".
# Optional: offset, len (bytes of the payload to use); then one of
#   values: {"hex": label}   bits: {"hexmask": label}   type: u|s with scale and add (value = raw * scale + add).
# confidence: C = same change seen at least twice, in both directions, action noted in session-log.md. P = anything less.
# A C signal's module must be status: confirmed in modules.yaml (the tests check).
# examples are real readings; the tests check every one decodes to the value given.
# Evidence and timestamps: local/references.md (not committed). Decoder: tool/p4doip/decode.py.

