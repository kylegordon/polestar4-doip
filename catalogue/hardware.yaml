# components: physical parts known from reads, behaviour and published sources.
#   conf: C/P as in signals.yaml for what was seen on this car; "doc" = from a published source only; "owner" = told by the owner.
components:
  - {name: "Rear drive motor", detail: "TZ220XSA02, permanent-magnet synchronous, 200 kW, 343 Nm; the same motor code as the Zeekr 001 RWD; the smart #1 uses the same family, TZ220XSA01/02 (docs/siblings.md)", conf: doc, source: "Polestar 4 UK owner's manual"}
  - {name: "Front drive motor", detail: "Dual-motor car; disconnects and stops about 9 s after selecting Range, turns all the time in Performance (1601:E3E8)", conf: C, source: "2026-11-15 drive"}
  - {name: "Motor speed limit", detail: "16,500 rpm for TZ220XSA02 in the Smart #1 manual; this car reaches about 82.8 rpm per km/h, so about 11.6-11.9:1 overall", conf: P, source: "Smart #1 manual; 2026-11-15 drive"}
  - {name: "Front motor controller", detail: "1631 (probable): vehicle speed, active only when the front motor drives", conf: P, source: "docs/findings.md"}
  - {name: "Rear inverter / e-machine", detail: "1637", conf: P, source: "docs/findings.md"}
  - {name: "HV battery", detail: "110 cell-group voltages (1635:DA31, EE19 = 110), 28 temperature sensors (EE83, EE20 = 28); 242.73 Ah rated (DA06), 241.4 Ah per 100 % SoC measured", conf: C, source: "2026-11-15 DC charge"}
  - {name: "12 V supply", detail: "14.0-14.2 V with the car awake (1656:4947, D110); 1656 may be the DC-DC converter (guess, hardware string HX1100)", conf: P, source: "docs/findings.md"}
  - {name: "Charge inlet", detail: "1650: inlet LEDs and lid (EE32)", conf: C, source: "docs/findings.md"}
  - {name: "Driver-assistance computer", detail: "1301, firmware names P417_EU and GAS52; seven camera entries (D921-D927), four camera types", conf: P, source: "docs/findings.md"}
  - {name: "Front radar", detail: "F5CP12 front-centre radar, 76-77 GHz, FCC ID NF3-F5CP12 (maker Bosch, from the FCC grantee code NF3, not named in the manual; the FCC filing calls it Front Radar Gen5 Car Plus and its label reads BOSCH ACC); the only radar the manual certifies. Its address is probably 1344 (label only)", conf: doc, source: "https://www.polestar.com/uk/manual/polestar-4/2026/article/d8eb41f1d4b91c11c0a8cc3748b783e2-9bc02397d4b9ca5fc0a8cc37097af9c5-8664b2fa77a7e089c0a8296870d1a409/; docs/siblings.md"}
  - {name: "Corner units 1316/1317", detail: "same hardware part 6608445312 as a left/right pair; radar guess weakened, since the manual certifies only one radar. A used part with this hardware and delivery part number is a Polestar-branded box with a wire antenna and CE, RCM and FCC marks but no FCC ID, listed by a dismantler as a tailgate control unit", conf: P, source: "docs/findings.md; docs/siblings.md"}
  - {name: "Chassis sensor 1675", detail: "the part number in 1675:D901 is sold used from a Polestar 4 AWD and a Zeekr 001 as a Bosch sensor (Bosch label, two-hole mount, orientation arrow, four-pin plug), called an acceleration or speed sensor; probably an inertial sensor (inference)", conf: doc, source: "docs/siblings.md"}
  - {name: "Parking sensors", detail: "10 distance channels on 1015 (B112-B121, cm), one per sensor: 4 front, 6 rear", conf: P, source: "2026-11-14 parked tests"}
  - {name: "Blind-spot lights", detail: "in the door mirrors, driven by 1A13 (left) and 1A12 (right), DID 4003", conf: C, source: "2026-11-15 drive"}
  - {name: "Headlamps", detail: "1BB3 left, 1BB4 right, same part; 32 individually controlled pixel LEDs per lamp; 1BB3:7022 holds 32 segment brightness bytes", conf: doc, source: "Polestar safety page; docs/findings.md"}
  - {name: "Rear-view camera mirror", detail: "Coupe body with no rear window", conf: owner, source: "docs/findings.md"}
  - {name: "Driver monitoring camera", detail: "1012", conf: P, source: "catalogue/modules.yaml"}
  - {name: "Head-up display", detail: "1251; continuous polling knocks out Pilot Assist (catalogue/hazards.yaml)", conf: P, source: "2026-11-15 drive"}
  - {name: "Dash camera", detail: "1314 (label only)", conf: P, source: "catalogue/modules.yaml"}
  - {name: "Key system control module", detail: "Marquardt BNCM, model GE1, FCC ID IYZGE1, Bluetooth LE; 1023 reports BNCM (F197) and MARQUARDT (F18A). The FCC label drawing names it communication module - BLE and NFC key and is headed Lotus (docs/siblings.md)", conf: doc, source: "https://www.polestar.com/uk/manual/polestar-4/2026/article/0a500a085a173960c0a8b09771bff25e-f19ebb76fc2e9629ac1b7acc5528389d-8664b2fa77a7e089c0a8296870d1a409/; docs/siblings.md"}
  - {name: "Key system radio parts", detail: "Marquardt UWB anchor GU1 (IYZGU1; six per car on CAN, daisy-chained to the body controller, per its FCC technical description), NFC reader GR3 (IYZGR3, filed as Lotus NFC Reader), key fob GK2 (IYZGK2, V216 keyfob); not seen as separate diagnostic addresses", conf: doc, source: "https://www.polestar.com/uk/manual/polestar-4/2026/article/0a500a085a173960c0a8b09771bff25e-f19ebb76fc2e9629ac1b7acc5528389d-8664b2fa77a7e089c0a8296870d1a409/; docs/siblings.md"}
  - {name: "Wireless phone charger", detail: "Changzhou Tenglong Auto Parts wireless charging module with NFC, 114.4-127.9 kHz charging, 13.56 MHz NFC; no diagnostic address of its own found", conf: doc, source: "https://www.polestar.com/uk/manual/polestar-4/2026/article/d8eb41f1d4b91c11c0a8cc3748b783e2-dfdd3d233eb7acaec0a8b0c176da1984-8664b2fa77a7e089c0a8296870d1a409/"}
  - {name: "Surround-view cameras", detail: "4 entries on 1015 (E30D-E310), type CAM000061, OmniVision OX03C10 2.5 MP viewing sensor", conf: P, source: "1015 E30D-E310 strings read on this car (sensor type OX03C10)"}
  - {name: "TPMS", detail: "four wheel sensors whose IDs sit on the CEM (1A01:281F, not published); pressures not found", conf: P, source: "docs/findings.md"}
  - {name: "Tyres", detail: "255/50 R20", conf: owner, source: "owner, 2026-11-15"}
  - {name: "Rear track", detail: "1,710-1,716 mm depending on tyre", conf: doc, source: "Polestar 4 owner's manual"}
