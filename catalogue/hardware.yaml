# Hardware on this Polestar 4: control units by diagnostic address, then physical components.
# Part numbers are catalogue numbers shared by every car of the same build, not per-car identifiers.
# Never add serials (F18C, F13F, F192, F198), the VIN or TPMS sensor IDs here.
#
# modules: read from runs/*/scan-*.jsonl (2026-11-10 to 2026-11-12; 1691 and 1B61 from 2026-11-22; checked against the 4.3.0 reads: only 1015 delivery changed, was 6608262501 A on 4.2.11), the latest ok read of each DID.
#   label:    usual short name from catalogue/modules.yaml (a guess unless that file says confirmed).
#   core:     F1AA, "ECU core assembly part number" (Geely numbering, 10 digits + revision): the hardware.
#   delivery: F1AB, "ECU delivery assembly part number" (Geely numbering): hardware plus its software as shipped.
#   core_80:  F12A, the same core assembly in the older 8-digit numbering.
#   f18a:     F18A text where printable (ISO name systemSupplierIdentifier; 100057 on all seven door and seat units).
#   box:      addresses that are one physical unit: same core part and the same real ECU serial (F18C; not the
#             placeholder 12345678/99999999 some units return) on both addresses, with different software.
# The F1AA/F1AB/F12A names are the ones used on related Volvo/Geely cars; the 10-digit format matches
# part 6608017285 (in 1023's F1BB), which a parts shop sells as "control unit for wireless charging".
